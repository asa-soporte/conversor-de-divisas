<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente exacto de tu imagen -->
    <linearGradient id="app-icon-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1952e4" />
      <stop offset="45%" stop-color="#2a63ee" />
      <stop offset="100%" stop-color="#5a6ef9" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado con gradiente -->
  <rect width="512" height="512" rx="116" fill="url(#app-icon-gradient)" />

  <!-- Flechas vectorizadas con terminaciones redondeadas -->
  <g stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Flecha superior (hacia la izquierda) -->
    <path d="M 188 100 L 108 175 L 188 250" />
    <path d="M 115 175 L 408 175" />

    <!-- Flecha inferior (hacia la derecha) -->
    <path d="M 104 337 L 397 337" />
    <path d="M 324 262 L 404 337 L 324 412" />
  </g>
</svg>
